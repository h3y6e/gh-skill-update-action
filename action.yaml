name: gh-skill-update-action
description: Run gh skill update and create a pull request if needed.

inputs:
  token:
    description: GitHub token used for gh and pull request creation. When omitted, the action uses the workflow GITHUB_TOKEN.
    required: false
  dir:
    description: Directory containing skills. If empty, gh skill update scans all known agent host directories.
    required: false
    default: ""
  branch:
    description: The pull request branch name.
    required: false
    default: gh-skill-update-action/patch
  commit-message:
    description: The message to use when committing changes.
    required: false
    default: "[gh-skill-update-action] automated change"
  title:
    description: The title of the pull request.
    required: false
    default: Changes by gh-skill-update-action
  body:
    description: The body of the pull request.
    required: false
    default: "Automated changes by [gh-skill-update-action](https://github.com/h3y6e/gh-skill-update-action)"

outputs:
  pr-number:
    description: The pull request number.
    value: ${{ steps.pr.outputs.pull-request-number }}
  pr-url:
    description: The pull request URL.
    value: ${{ steps.pr.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Set up GitHub CLI with skill command
      run: |
        gh skill --help >/dev/null 2>&1 || {
          type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)
          sudo install -d -m 755 /etc/apt/keyrings /etc/apt/sources.list.d
          out=$(mktemp)
          wget -nv -O"$out" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo install -m 644 "$out" /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt update
          sudo apt install gh -y
        }
        gh skill --help >/dev/null
      shell: bash

    - name: Update skills
      run: |
        if [[ -n "$INPUT_DIR" ]]; then
          gh skill update --dir "$INPUT_DIR" --all
        else
          gh skill update --all
        fi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        INPUT_DIR: ${{ inputs.dir }}

    - name: Create pull request
      id: pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ inputs.token || github.token }}
        branch: ${{ inputs.branch }}
        commit-message: ${{ inputs.commit-message }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
